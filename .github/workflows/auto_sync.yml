name: VEE 24x7 Multi-Portal Cloud Auto-Sync

on:
  schedule:
    # Runs automatically every 60 minutes (24x7 non-stop) in the cloud
    - cron: '0 * * * *'
  workflow_dispatch: # Allows 1-click manual sync anytime from GitHub UI

permissions:
  contents: write

jobs:
  auto-sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🌐 Run Multi-Portal Failover Scraper (12+ Portals)
        run: node scraper/live_crawler.js

      - name: 🚀 Commit & Push Live Scraped Data
        run: |
          git config --global user.name "VEE Cloud Auto-Bot"
          git config --global user.email "bot@vacancyeraeducation.com"
          git add src/data/liveScrapedData.json public/live_data.json src/data/initialBooks.js
          if git diff --staged --quiet; then
            echo "No new updates found. Skipping commit."
          else
            git commit -m "🤖 VEE 24x7 Auto-Sync: $(date +'%d-%b-%Y %H:%M UTC') - FreeJobAlert, SarkariResult & Current Affairs"
            git push
          fi
